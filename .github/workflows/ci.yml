name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paycurb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OWNER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/paycurb
      DATABASE_URL: postgres://paycurb_app:ci_password@localhost:5432/paycurb
      APP_DB_PASSWORD: ci_password
      OWNER_PASSWORD: ci-owner-password
      SESSION_SECRET: ci-session-secret
      PAYPAL_ENV: sandbox
      PAYPAL_CLIENT_ID: ci
      PAYPAL_CLIENT_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paycurb/proxy migrate
      - run: pnpm -r typecheck
      - run: pnpm -r test
